<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#fff"/>

  <!-- Mástil con remate -->
  <rect x="14" y="12" width="4" height="44" rx="2" fill="url(#pole)"/>
  <circle cx="16" cy="10" r="3.5" fill="#fff" stroke="#111" stroke-width="1.5"/>

  <!-- Bandera ondeando -->
  <path d="M18 14c8-4 14 3 22 0s12-3 14-2v24c-2-1-6-1-14 2s-14-4-22 0z" fill="url(#flag)" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pliegue -->
  <path d="M30 13.5c3 1 6 1.6 10 .5v24c-4 1.2-7 .6-10-.5z" fill="#000" opacity=".06"/>

  <!-- Texto -->
  <text x="36" y="30.5" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="12.5" letter-spacing="-.3" fill="#111">MOS</text>
