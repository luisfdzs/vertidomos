  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Mástil con remate -->
  <rect x="14" y="12" width="4" height="44" rx="2" fill="url(#pole)"/>
  <circle cx="16" cy="10" r="3.5" fill="#fbbf24"/>

